version: "3.8"
services:
    mongodb:
        image: mongo:7.0
        container_name: remplamed_mongodb
        restart: always
        environment:
            - MONGO_INITDB_ROOT_USERNAME=root
            - MONGO_INITDB_ROOT_PASSWORD=rootpassword
        ports:
            - "27018:27017"
        volumes:
            - mongodb_data:/data/db

volumes:
    mongodb_data:
