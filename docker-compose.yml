version: "3.8"
services:
    postgres:
        image: postgres
        container_name: remplamed_postgres
        restart: always
        env_file:
            - .env
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    mongodb:
        image: mongo:7.0
        container_name: remplamed_mongodb
        restart: always
        environment:
            - MONGO_INITDB_ROOT_USERNAME=root
            - MONGO_INITDB_ROOT_PASSWORD=rootpassword
        ports:
            - "27018:27017"
        volumes:
            - mongodb_data:/data/db

volumes:
    postgres_data:
    mongodb_data:
